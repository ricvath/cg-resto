name: Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: siteground-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: siteground-production

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production website
        run: npm run build

      - name: Configure SiteGround SSH access
        env:
          SITEGROUND_PRIVATE_KEY: ${{ secrets.SITEGROUND_PRIVATE_KEY }}
          SITEGROUND_KEY_PASSPHRASE: ${{ secrets.SITEGROUND_KEY_PASSPHRASE }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SITEGROUND_PRIVATE_KEY" > ~/.ssh/siteground_deploy
          chmod 600 ~/.ssh/siteground_deploy

          cat > "$RUNNER_TEMP/ssh-askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SITEGROUND_KEY_PASSPHRASE"
          EOF
          chmod 700 "$RUNNER_TEMP/ssh-askpass"

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass" SSH_ASKPASS_REQUIRE=force \
            setsid ssh-add ~/.ssh/siteground_deploy </dev/null

          for attempt in 1 2 3; do
            if ssh-keyscan -T 20 -p 18765 ssh.cortesgardenmarbella.com >> ~/.ssh/known_hosts; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not retrieve the SiteGround SSH host key." >&2
              exit 1
            fi
          done
          chmod 600 ~/.ssh/known_hosts

      - name: Upload build to SiteGround
        run: |
          rsync -az --delete \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            -e 'ssh -p 18765' \
            dist/ \
            u47-1hixqkumdqla@ssh.cortesgardenmarbella.com:/home/customer/www/cortesgardenmarbella.com/public_html/
